<!DOCTYPE html>
<html>
<head>
    <title>Test Batch QR Generation</title>
</head>
<body>
    <h1>Test Batch QR Generation</h1>
    <p>Open the developer console to see the results.</p>
    
    <script>
        // Simple test to verify the fix
        console.log('Batch QR Generation Fix Test');
        console.log('QR_TYPES object:', typeof QR_TYPES !== 'undefined' ? 'Available' : 'Not available');
        
        // Simulate the fixed logic
        const qrType = 'url';
        const line = 'https://example.com';
        
        if (typeof QR_TYPES !== 'undefined' && QR_TYPES[qrType]) {
            let qrData = line;
            switch (qrType) {
                case 'url':
                    qrData = line;
                    break;
                case 'text':
                    qrData = line;
                    break;
                case 'email':
                    qrData = `mailto:${line}`;
                    break;
                case 'sms':
                    qrData = `sms:${line}`;
                    break;
                case 'wifi':
                    qrData = `WIFI:S:${line};;`;
                    break;
                case 'vcard':
                    qrData = `BEGIN:VCARD\nFN:${line}\nEND:VCARD`;
                    break;
                default:
                    qrData = line;
            }
            
            console.log('QR Data for', qrType, ':', qrData);
        }
    </script>
</body>
</html>
