<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test QR Generation</title>
	<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
	<h1>Test QR Generation</h1>
	<button onclick="generateTestQR()">Generar QR de Prueba</button>
	<div id="qrOutput"></div>

	<script>
		function generateTestQR() {
			if (typeof QRCode === 'undefined') {
				alert('QRCode library not loaded!');
				return;
			}

			QRCode.toDataURL('https://example.com', {
				width: 256,
				errorCorrectionLevel: 'M',
				color: {
					dark: '#000000',
					light: '#FFFFFF'
				},
				margin: 4
			}, function(err, url) {
				if (err) {
					alert('Error: ' + err.message);
					return;
				}
				
				const img = document.createElement('img');
				img.src = url;
				img.alt = 'QR Code';
				document.getElementById('qrOutput').innerHTML = '';
				document.getElementById('qrOutput').appendChild(img);
			});
		}
	</script>
</body>
</html>
